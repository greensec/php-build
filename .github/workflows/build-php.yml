name: build php packages

on:
  workflow_dispatch:
    inputs:
      php_branch:
        description: 'PHP branch ("all" = every phpnet branch in conf/branches.map)'
        type: choice
        required: true
        options:
          - 'all'
          - '8.2'
          - '8.3'
          - '8.4'
          - '8.5'
          - '8.6'
          - '8.1'
          - '8.0'
          - '7.4'
          - '7.3'
          - '7.2'
          - '7.1'
          - '7.0'
          - '5.6'
      dist:
        description: 'Target suite'
        type: choice
        required: true
        default: 'bullseye'
        options:
          - 'bullseye'
          - 'buster'
      release:
        description: 'publish to apt repository'
        type: boolean
        required: true
        default: false

permissions:
  contents: write

jobs:
  branches:
    runs-on: ubuntu-latest
    outputs:
      list: ${{ steps.list.outputs.branches }}
    steps:
      - uses: actions/checkout@v7
      - id: list
        run: |
          if [ "${{ inputs.php_branch }}" = "all" ]; then
            awk '$1 ~ /^[0-9]/ && $2 == "phpnet" {print $1}' conf/branches.map \
              | jq -R . | jq -sc . >/tmp/branches.json
          else
            printf '["%s"]\n' "${{ inputs.php_branch }}" >/tmp/branches.json
          fi
          cat /tmp/branches.json
          echo "branches=$(cat /tmp/branches.json)" >> "$GITHUB_OUTPUT"

  build:
    needs: branches
    name: "php${{ matrix.php_branch }} for ${{ inputs.dist }}"
    strategy:
      fail-fast: false
      # serialize matrix jobs at the strategy level - a concurrency group
      # only holds one pending job, so queued matrix jobs would cancel
      # each other
      max-parallel: 1
      matrix:
        php_branch: ${{ fromJSON(needs.branches.outputs.list) }}
    # serialize builds - the runner fleet is one box and the publish step
    # pushes to the same gh-pages branch
    concurrency:
      group: "php-build-${{ inputs.dist }}"
      cancel-in-progress: false
    runs-on: [self-hosted, linux, x64]
    container:
      image: "debian:${{ inputs.dist }}"
      # tmpfs workdir for the build tree (runner has 125G RAM)
      options: --shm-size=32g
    steps:
      - name: Point EOL suites at archive.debian.org
        if: inputs.dist == 'bullseye' || inputs.dist == 'buster'
        run: |
          sed -i -e '/${{ inputs.dist }}-updates/d' \
              -e 's|deb\.debian\.org/debian-security|archive.debian.org/debian-security|g' \
              -e 's|deb\.debian\.org/debian|archive.debian.org/debian|g' \
              -e 's|security\.debian\.org/debian-security|archive.debian.org/debian-security|g' \
              /etc/apt/sources.list
          # bullseye-backports was emptied at EOL; buster-backports still
          # carries debhelper 13 and lives on archive - keep/enable it
          if [ "${{ inputs.dist }}" = bullseye ]; then
            sed -i '/bullseye-backports/d' /etc/apt/sources.list
          else
            grep -q buster-backports /etc/apt/sources.list || \
              echo "deb http://archive.debian.org/debian buster-backports main" \
              >>/etc/apt/sources.list
          fi

      - name: Install git for checkout
        run: apt-get update -qq && apt-get install -y --no-install-recommends git ca-certificates

      - name: Checkout
        uses: actions/checkout@v7

      - name: Cache build
        uses: actions/cache@v6
        with:
          path: |
            cache
          # unique key per run = always save; restore-keys pulls the
          # latest ccache for this branch+dist
          key: "${{ inputs.dist }}-php${{ matrix.php_branch }}-build-cache-${{ github.run_id }}"
          restore-keys: |
            ${{ inputs.dist }}-php${{ matrix.php_branch }}-build-cache-
            ${{ inputs.dist }}-php${{ matrix.php_branch }}-

      - name: Build package
        run: ./scripts/build.sh
        env:
          PHP_BRANCH: ${{ matrix.php_branch }}
          DIST: ${{ inputs.dist }}
          # keeps rebuilt versions unique for the repo publisher's dedupe
          BUILD_ID: ${{ github.run_number }}

      - name: Cache build
        uses: actions/cache/save@v6
        if: always()
        with:
          path: |
            cache
          key: "${{ inputs.dist }}-php${{ matrix.php_branch }}-build-cache-${{ github.run_id }}"

      - name: Upload deb files
        uses: actions/upload-artifact@v7
        with:
          name: "php${{ matrix.php_branch }}-${{ inputs.dist }}"
          path: ./out/*.deb

      - name: Publish to gh-pages apt repo
        uses: smeinecke/apt-repo-action@v2.2.4
        if: inputs.release == true
        with:
          github_token: ${{ github.token }}
          repo_supported_arch: amd64
          repo_supported_version: ${{ inputs.dist }}
          file: |
            ./out/*.deb
          version_by_filename: true
          private_key: ${{ secrets.APT_SIGNING_KEY }}
          public_key: ${{ vars.APT_PUBLIC_KEY }}
          key_passphrase: ""
          skip_duplicates: true
